# Render blueprint for the API and its database.
#
# The client is deployed separately on Vercel (see client/vercel.json). Because
# the two live on different sites, the API must run with CROSS_SITE_COOKIES=true
# so the refresh cookie is issued as SameSite=None; Secure, and CLIENT_URL must
# list every origin allowed to send credentialed requests.
services:
  - type: web
    name: txst-study-hub-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5050
      - key: DATABASE_URL
        fromDatabase:
          name: txst-study-hub-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_COOKIE_NAME
        value: refreshToken
      - key: CROSS_SITE_COOKIES
        value: 'true'
      - key: ALLOWED_EMAIL_DOMAIN
        value: txstate.edu
      # Set this to the deployed Vercel origin(s), comma-separated.
      - key: CLIENT_URL
        sync: false
      # Password for the seeded demo account. Set it, or clear the client's
      # VITE_DEMO_* variables to hide the demo button entirely.
      - key: DEMO_PASSWORD
        sync: false

databases:
  - name: txst-study-hub-db
    plan: free
    databaseName: txst_study_hub
    user: txst_user
